name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Conventional Commits (CHAOS-156): semantic-release liest daraus die Version der Mac-App. Prüft jeden
  # Commit des PRs; Merge-Commits sind ausgenommen. Regeln: commitlint.config.mjs, Erklärung in CLAUDE.md.
  commits:
    name: Commit-Nachrichten (Conventional Commits)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: commitlint
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: pnpm exec commitlint --from "$BASE" --to "$HEAD" --verbose

  check:
    name: Typecheck, Lint, Format, Test, Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # Start-Bundle des Hosts: Budget und keine Babylon-Engine vor der Lobby (CHAOS-53).
      # Dazu das JS-Bündel des Apple-Hosts: Budget, keine Node-Module, kein `ws` (CHAOS-139).
      - name: Host-Start-Bundle und Apple-Host-Bündel
        run: pnpm check:bundle

      # Das echte Apple-Host-Bündel in einem nackten Kontext (ohne Node-/DOM-APIs): drei ganze
      # Partien mit Revanche und zwei Bot-Controllern, alle Minispiele der Rotation, renderState
      # gegen den Vertrag, Speicher nach Partie 3 < 20 MB über Partie 1 (CHAOS-141).
      # Eine Partie läuft im macOS-Job in JavaScriptCore (Swift-Harness).
      - name: Apple-Host – Bot-Partien (Node)
        run: pnpm --filter @chaos-party/apple-host bots --full --matches 3

      # Regel Rückenwind über `HostEnv.tailwind` (CHAOS-188): Die Karte muss in einer ganzen
      # Partie erscheinen (ohne die Regel prüft der Schritt davor, dass sie nie erscheint).
      - name: Apple-Host – Bot-Partie mit Rückenwind (Node)
        run: pnpm --filter @chaos-party/apple-host bots --full --rueckenwind

      - name: Apple-Host – Beispielnachrichten aktuell
        run: node scripts/export-apple-host-fixtures.mjs --check

      - name: Rauchtest Start (pnpm play)
        run: pnpm smoke

      - name: Lizenzen
        run: pnpm check:licenses

      # Asset-Manifest: Dateien, Lizenzen, Budgets, Figuren-Vertrag (CHAOS-28).
      - name: Assets
        run: pnpm check:assets

      # Browser-Cache je Playwright-Version (in package.json fest gepinnt). Bei einem
      # Treffer fehlen nur die System-Bibliotheken, die `install-deps` nachzieht.
      - name: Playwright-Version bestimmen
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Playwright-Browser aus dem Cache
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium

      - name: Playwright-Browser installieren
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Playwright-Systempakete installieren
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      # Baut einmal (global-setup), dann je Test ein eigener Server im Testprozess.
      - name: E2E (Production-Build, Chromium)
        run: pnpm test:e2e --trace off

      - name: E2E-Ergebnisse hochladen
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-ergebnisse
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  # USDZ für den nativen Apple-Host (CHAOS-140): der ganze Build-Schritt unter Linux, Figuren mit
  # Blender als Python-Modul, Brett aus dem Web-Host (Software-Rendering), Prüfung mit usd-core.
  # Ob RealityKit die Dateien lädt, prüft nur ein Mac (TestFlight-Workflow, Gerätecheckliste).
  apple-assets:
    name: Apple-Assets (USDZ)
    runs-on: ubuntu-latest
    # Je Brett ≈ 3–10 min Export unter Software-Rendering (CHAOS-212/199: zwei Bretter).
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # bpy 5.3 gibt es nur für Python 3.13.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: packages/assets/blender/requirements.txt

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Blender als Python-Modul und usd-core
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libxrender1 libxxf86vm1 libxfixes3 libxi6 libxkbcommon0 libsm6 libgl1
          python -m venv .venv-blender
          .venv-blender/bin/pip install -r packages/assets/blender/requirements.txt
          echo "BLENDER_PYTHON=$PWD/.venv-blender/bin/python" >> "$GITHUB_ENV"

      - name: Playwright-Version bestimmen
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Playwright-Browser aus dem Cache
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium

      - name: Playwright-Browser installieren
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Playwright-Systempakete installieren
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: USDZ erzeugen und prüfen
        env:
          BOARD_EXPORT_TIMEOUT: '900000'
        run: pnpm build:apple-assets

      # Budgets der Build-Artefakte (Manifest „builds“) jetzt mit echten Dateien.
      - name: Assets mit Build-Artefakten
        run: pnpm check:assets

      - name: USDZ hochladen
        uses: actions/upload-artifact@v7
        with:
          name: apple-assets
          path: build/apple-assets/
          retention-days: 7

  # Native Apps (CHAOS-115, CHAOS-78, CHAOS-139): bauen ohne Signatur, Controller-Tests im
  # Simulator, Apple-Host: Bot-Partie in JavaScriptCore und App für macOS und tvOS.
  # Öffentliches Repo: macOS-Runner kosten keine Minuten.
  apple:
    name: Native Apps (iOS, iPadOS, tvOS, macOS)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Für die Integrationstests (echter Server) und den Fixture-Abgleich.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Werkzeuge
        run: |
          brew install xcodegen
          xcodebuild -version

      - name: Protokoll-Fixtures aktuell
        if: hashFiles('scripts/export-protocol-fixtures.mjs') != ''
        run: node scripts/export-protocol-fixtures.mjs --check

      - name: Controller-App bauen (iOS-Gerät, ohne Signatur)
        if: hashFiles('apps/controller-ios/project.yml') != ''
        working-directory: apps/controller-ios
        run: |
          xcodegen generate
          xcodebuild -project ChaosController.xcodeproj -scheme ChaosController \
            -destination 'generic/platform=iOS' -configuration Release \
            -derivedDataPath build/ci CODE_SIGNING_ALLOWED=NO build

      - name: Controller-Tests (Simulator, mit echtem Server)
        if: hashFiles('apps/controller-ios/project.yml') != ''
        run: apps/controller-ios/scripts/run-tests.sh

      # Beleg für geänderte Controller-Bildschirme (CHAOS-127): Beispielzustände im Simulator.
      - name: Controller-Screenshots (Simulator)
        if: hashFiles('apps/controller-ios/scripts/screenshots.sh') != ''
        run: apps/controller-ios/scripts/screenshots.sh minigameConsolation minigameResults minigameVote minigamePractice

      - name: Controller-Screenshots hochladen
        if: always() && hashFiles('apps/controller-ios/scripts/screenshots.sh') != ''
        uses: actions/upload-artifact@v7
        with:
          name: controller-ios-screenshots
          path: apps/controller-ios/build/screenshots/
          retention-days: 14
          if-no-files-found: ignore

      # CHAOS-147: Startparameter vor gespeicherter Messvariante, Menüwahl, Speicherung.
      - name: Renderer-Spike Varianten prüfen
        if: hashFiles('spikes/renderer-realitykit/tests/main.swift') != ''
        working-directory: spikes/renderer-realitykit
        run: |
          mkdir -p build
          swiftc app/Settings.swift app/Variants.swift tests/main.swift -o build/variants-check
          build/variants-check

      - name: Renderer-Spike bauen (macOS, iOS, tvOS, ohne Signatur)
        if: hashFiles('spikes/renderer-realitykit/project.yml') != ''
        working-directory: spikes/renderer-realitykit
        # `assets/export/` (Testszene) wird lokal erzeugt und ist nicht eingecheckt; ohne den
        # Ordner bricht Xcode beim Kopieren der Ressource ab. CI prüft nur den Build, also leer.
        run: |
          mkdir -p assets/export
          xcodegen generate
          for destination in 'generic/platform=macOS' 'generic/platform=iOS' 'generic/platform=tvOS'; do
            xcodebuild -project ChaosRenderSpike.xcodeproj -scheme ChaosRenderSpike \
              -destination "$destination" -configuration Release \
              -derivedDataPath build/ci CODE_SIGNING_ALLOWED=NO build
          done

      # Apple-Host (ADR-019, CHAOS-139): JS-Kern und Controller bauen, eine ganze Bot-Partie im
      # JSContext spielen (Swift-Harness, scheitert bei jeder JS-Ausnahme), dann die App bauen.
      - name: Apple-Host – JS-Kern und Controller bauen
        if: hashFiles('apps/apple-host/project.yml') != ''
        run: |
          pnpm --filter @chaos-party/apple-host --filter @chaos-party/controller build
          pnpm notices

      - name: Apple-Host – ganze Bot-Partie in JavaScriptCore (Swift-Harness)
        if: hashFiles('apps/apple-host/project.yml') != ''
        env:
          # Ohne JIT wie auf tvOS; JSC im Harness läuft auf macOS ohnehin faktisch ohne (EXP-024).
          JSC_useJIT: 'false'
        run: apps/apple-host/harness/run.sh full

      # Gedrosselter Takt (CHAOS-205): mit 10 Ticks je Sekunde muss jede Minispiel-Bühne vor dem
      # Ende des Countdowns fertig sein (Aufbau-Budget wächst mit der Tick-Dauer).
      - name: Apple-Host – ganze Bot-Partie mit 10 Hz in JavaScriptCore (Swift-Harness)
        if: hashFiles('apps/apple-host/project.yml') != ''
        env:
          JSC_useJIT: 'false'
        run: apps/apple-host/harness/run.sh full hz=10

      - name: Apple-Host bauen (macOS, tvOS, ohne Signatur)
        if: hashFiles('apps/apple-host/project.yml') != ''
        working-directory: apps/apple-host
        # Nur Übersetzen und Selbsttest: ohne USDZ (die baut der Job „Apple-Assets“ unter Linux; TestFlight
        # und Release bauen sie selbst), die App fällt dann auf Grundkörper zurück.
        run: |
          SKIP_BUILD=1 OHNE_ASSETS=1 ./prepare.sh
          xcodegen generate
          for destination in 'generic/platform=macOS' 'generic/platform=tvOS'; do
            xcodebuild -project ChaosHost.xcodeproj -scheme ChaosHost \
              -destination "$destination" -configuration Release \
              -derivedDataPath build/ci CODE_SIGNING_ALLOWED=NO build
          done

      # App-Store-Variante für TestFlight am Mac (CHAOS-200): ad hoc signiert mit App Sandbox, ohne Sparkle.
      # Der Selbsttest läuft in der Sandbox (Listener, HTTP, WebSocket); Upload nur in testflight-macos.yml.
      - name: Apple-Host – App-Store-Variante (Sandbox, Selbsttest)
        if: hashFiles('apps/apple-host/scripts/testflight-macos.sh') != ''
        working-directory: apps/apple-host
        run: |
          xcodebuild -project ChaosHost.xcodeproj -scheme ChaosHostAppStore \
            -destination 'generic/platform=macOS' -configuration Release \
            -derivedDataPath build/ci-appstore build
          app="build/ci-appstore/Build/Products/Release/Chaos Party.app"
          [ ! -e "$app/Contents/Frameworks/Sparkle.framework" ] || { echo "::error::Sparkle im App-Store-Build"; exit 1; }
          "$app/Contents/MacOS/Chaos Party" --selftest

      # Mac-Release ohne Secrets probeweise (CHAOS-118): dasselbe Skript wie release-macos.yml, aber ad hoc
      # signiert. Prüft Archiv, Hardened Runtime, Entitlements und den Selbsttest der fertigen App (JS-Kern,
      # Havok, HTTP, WebSocket-Beitritt). Nur Notarisierung und Heften laufen erst im Release-Workflow.
      # Sparkle (CHAOS-156): ein Wegwerf-Schlüsselpaar nur für diesen Lauf, im Format von `generate_keys -x`
      # (base64 des 32-Byte-Seeds) und SUPublicEDKey (base64 der 32 Byte). Der echte Schlüssel ist nur im
      # Release-Workflow (Secret SPARKLE_ED_PRIVATE_KEY).
      - name: Apple-Host – Wegwerf-Schlüssel für Sparkle
        if: hashFiles('apps/apple-host/scripts/sparkle-feed.sh') != ''
        run: |
          node -e '
            const { generateKeyPairSync } = require("node:crypto");
            const { publicKey, privateKey } = generateKeyPairSync("ed25519");
            const b64 = (s) => Buffer.from(s, "base64url").toString("base64");
            const pub = b64(publicKey.export({ format: "jwk" }).x);
            const priv = b64(privateKey.export({ format: "jwk" }).d);
            console.log(`::add-mask::${priv}`);
            require("node:fs").appendFileSync(process.env.GITHUB_ENV, `SPARKLE_PUBLIC_ED_KEY=${pub}\nSPARKLE_ED_PRIVATE_KEY=${priv}\n`);
          '

      - name: Apple-Host – Mac-Release probeweise (ad hoc, Hardened Runtime, Selbsttest)
        id: mac-release
        if: hashFiles('apps/apple-host/scripts/release-macos.sh') != ''
        env:
          RELEASE_DRY_RUN: '1'
          SKIP_PREPARE: '1'
        run: apps/apple-host/scripts/release-macos.sh

      # Derselbe Feed-Weg wie im Release-Workflow: sign_update signiert den Zip, appcast.mjs prüft die Signatur
      # gegen den Schlüssel der App, sign_update signiert und prüft die appcast.xml.
      - name: Apple-Host – Sparkle-Feed probeweise
        if: hashFiles('apps/apple-host/scripts/sparkle-feed.sh') != ''
        env:
          ZIP: ${{ steps.mac-release.outputs.zip }}
        run: |
          ZIP="$GITHUB_WORKSPACE/$ZIP" VERSION=0.1.0 BUILD_NUMBER="$GITHUB_RUN_NUMBER" APPCAST="$RUNNER_TEMP/appcast.xml" \
            DOWNLOAD_URL=https://example.invalid/Chaos-Party-0.1.0-macOS.zip RELEASE_URL=https://example.invalid/ \
            PRERELEASE=true apps/apple-host/scripts/sparkle-feed.sh
